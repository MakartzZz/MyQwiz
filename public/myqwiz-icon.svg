<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">MyQwiz</title>
  <desc id="description">Gato minimalista verde oliva con dos ojos blancos sobre un fondo claro.</desc>

  <defs>
    <linearGradient id="icon-background" x1="52" y1="36" x2="454" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f4ef" />
      <stop offset="1" stop-color="#d8ddd4" />
    </linearGradient>
    <linearGradient id="cat-body" x1="256" y1="54" x2="256" y2="446" gradientUnits="userSpaceOnUse">
      <stop stop-color="#789168" />
      <stop offset="1" stop-color="#405936" />
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#263522" flood-opacity=".25" />
    </filter>
    <clipPath id="app-icon-shape">
      <rect x="16" y="16" width="480" height="480" rx="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#app-icon-shape)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#icon-background)" />
    <circle cx="102" cy="84" r="190" fill="#ffffff" opacity=".16" />

    <path
      d="M256 452C111 452 56 350 61 224 66 118 107 53 158 53c51 0 72 76 82 152h32c10-76 31-152 82-152 51 0 92 65 97 171 5 126-50 228-195 228Z"
      fill="url(#cat-body)"
      filter="url(#cat-shadow)"
    />

    <g fill="#fffdf8">
      <rect x="160" y="260" width="58" height="128" rx="29" />
      <rect x="294" y="260" width="58" height="128" rx="29" />
    </g>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity=".48" stroke-width="5" />
</svg>
